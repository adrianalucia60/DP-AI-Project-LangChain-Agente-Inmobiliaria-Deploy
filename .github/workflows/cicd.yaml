name: Deploy to Cloud Run

env:
  SERVICE_NAME: servicio-backend-agente-inmobiliario-aalvarez
  PROJECT_ID: datapath-ai17-adriana-alvarez
  DOCKER_IMAGE_URL: us-central1-docker.pkg.dev/datapath-ai17-adriana-alvarez/repositorio-backend-langchain-inmobiliaria/imagen-backend-langchain-inmobiliaria

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  dockerize-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2


      # ===== NUEVO: Crear archivo .env desde secreto =====
         # ===== - name: Crear archivo .env
          # =====  run: |
          # =====    echo "${{ secrets.ENV_FILE }}" > application/.env

        # =====  # ===== NUEVO: Crear archivo de credenciales =====
       # =====   - name: Crear archivo de credenciales
        # =====    run: |
         # =====     mkdir -p application/credentials
         # =====     echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > application/credentials/datapath-ai17-adriana-alvarez-0ff7a53933aa.json


      - name: Google Cloud Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}'
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Cloud SDK
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: Configure Docker
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE_URL }}:latest -f Dockerfile.prod .
          docker push ${{ env.DOCKER_IMAGE_URL }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image ${{ env.DOCKER_IMAGE_URL }}:latest \
            --platform managed \
            --region us-central1 \
            --allow-unauthenticated \
            --service-account=deploy-langchain-agente-inmobi@datapath-ai17-adriana-alvarez.iam.gserviceaccount.com \
            --timeout=3600 \
            --memory=2Gi \
            --cpu=2 \
            --set-env-vars PORT=8080 \
            --startup-probe-timeout=600